<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Icon</title>
</head>

<body>
    <svg width="200" height="200" viewBox="0 0 120 120">

        <polygon points="20,45 50,20 80,45" fill="#ff3333" stroke="#333" stroke-width="5" class="home-roof" />

        <rect x="30" y="45" width="40" height="35" fill="#9494b8" stroke="#333" stroke-width="5" class="home-body" />

    </svg>

    <svg width="80" height="80" viewBox="0 0 100 100">

        <circle cx="50" cy="50" r="35" fill="#ff0000" stroke="#ff0000" stroke-width="5" />

        <line x1="35" y1="50" x2="65" y2="50" stroke="white" stroke-width="6" stroke-linecap="round" />

        <line x1="50" y1="35" x2="50" y2="65" stroke="white" stroke-width="6" stroke-linecap="round" />
    </svg>

    <svg width="200" height="100" viewBox="0 0 100 100">

        <polygon points="30,15 70,15 70,80 50,65 30,80" fill="#0099ff" stroke="#0099ff" stroke-width="5"
            stroke-linejoin="round" />
    </svg>
</body>

</html>
