<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG India Flag</title>
</head>
<body>
<svg width="420" height="250">
    <style>
        .orange {
            fill: #FF9933;
            stroke: black;
            stroke-width: 2;
        }

        .white {
            fill: white;
            stroke: black;
            stroke-width: 2;
        }

        .green {
            fill: #138808;
            stroke: black;
            stroke-width: 2;
        }

        .chakra {
            fill: none;
            stroke: navy;
            stroke-width: 3;
        }
    </style>

    <rect x="20" y="20" width="300" height="60" class="orange" />

    <rect x="20" y="80" width="300" height="60" class="white" />

    <rect x="20" y="140" width="300" height="60" class="green" />

    <circle cx="170" cy="110" r="22" class="chakra" />

</svg>
</body>
</html>
