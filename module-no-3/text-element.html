<!DOCTYPE html>
<html>
<head>
    <title>SVG Text Example</title>
</head>
<body>

<svg width="800" height="500" style="border:2px solid black;">

    <text x="50" y="50"
          font-size="30"
          fill="blue">
        Simple SVG Text
    </text>

    <text x="300" y="50"
          font-size="25"
          fill="green">
        Different Position
    </text>

    <text x="50" y="120"
          font-size="20"
          fill="purple">
        Small Text
    </text>

    <text x="50" y="170"
          font-size="40"
          fill="orange">
        Large Text
    </text>

 
    <text x="50" y="240"
          font-size="30"
          font-weight="bold"
          fill="red">
        Bold Text
    </text>

 
    <text x="300" y="240"
          font-size="30"
          font-style="italic"
          fill="brown">
        Italic Text
    </text>

  
    <text x="550" y="240"
          font-size="30"
          font-family="Courier New"
          fill="darkblue">
        Courier Font
    </text>

   

   
    <line x1="400" y1="280" x2="400" y2="420"
          stroke="black"
          stroke-sold="5"/>

    <text x="400" y="320"
          text-anchor="start"
          font-size="25"
          fill="green">
        Start
    </text>


    <text x="400" y="360"
          text-anchor="middle"
          font-size="25"
          fill="blue">
        Middle
    </text>

 
    <text x="400" y="400"
          text-anchor="end"
          font-size="25"
          fill="red">
        End
    </text>

    <rect x="520"
          y="320"
          width="200"
          height="70"
          rx="10"
          ry="10"
          fill="#4CAF50">
    </rect>

    <text x="620"
          y="365"
          text-anchor="middle"
          font-size="28"
          fill="white"
          font-weight="bold">
        Click Me
    </text>

</svg>

</body>
</html>
